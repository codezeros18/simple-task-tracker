services:
  db:
    image: postgres:18-alpine
    env_file: backend/.env
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18+ keeps its data here, not in /var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-time init the server only listens on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
